name: Deploy to GitHub Pages

# Publica cada carpeta del repo (biblioteca/ y una por proyecto) y una portada que lleva a la biblioteca.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del último commit de cada carpeta

      - name: Comprobar la biblioteca
        run: node .github/scripts/comprobar-biblioteca.mjs

      - name: "Build the site (_site/ con carpetas, portada, sitemap.xml, llms-full.txt y md/)"
        run: node .github/scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
