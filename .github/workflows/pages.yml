name: Deploy to GitHub Pages

# Publica cada carpeta del repo (biblioteca/ y una por proyecto) y una portada que lleva a la biblioteca.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del último commit de cada carpeta

      - name: Comprobar la biblioteca
        run: node .github/scripts/comprobar-biblioteca.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          for dir in */; do
            [ "$dir" = "_site/" ] && continue
            cp -R "$dir" _site/
          done
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Biblioteca · Documentación de los proyectos de Renzo Ramos</title>
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=biblioteca/" />
              <link rel="canonical" href="https://renzoramosdev.github.io/Documentacion-Proyectos-Renzo-Ramos/biblioteca/" />
            </head>
            <body>
              <p><a href="biblioteca/">Ir a la biblioteca</a></p>
            </body>
          </html>
          HTML

      - name: Build the Markdown for search engines and AIs (llms-full.txt, md/)
        run: node .github/scripts/build-llms.mjs _site/biblioteca

      - name: Build the sitemap
        run: |
          site="https://renzoramosdev.github.io/Documentacion-Proyectos-Renzo-Ramos"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for dir in */; do
              [ "$dir" = "_site/" ] && continue
              name="${dir%/}"
              lastmod="$(git log -1 --format=%cI -- "$dir")"
              priority="0.8"; [ "$name" = "biblioteca" ] && priority="1.0"
              echo "  <url><loc>${site}/${name}/</loc><lastmod>${lastmod}</lastmod><priority>${priority}</priority></url>"
            done
            echo '</urlset>'
          } > _site/sitemap.xml
          cat _site/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
