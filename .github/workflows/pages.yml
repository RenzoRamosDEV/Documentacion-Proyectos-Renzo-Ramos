name: Deploy to GitHub Pages

# Publica cada carpeta del repo (biblioteca/ y una por proyecto) y una portada que lleva a la biblioteca.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          for dir in */; do
            [ "$dir" = "_site/" ] && continue
            cp -R "$dir" _site/
          done
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Biblioteca · Documentación de los proyectos de Renzo Ramos</title>
              <meta http-equiv="refresh" content="0; url=biblioteca/" />
              <link rel="canonical" href="biblioteca/" />
            </head>
            <body>
              <p><a href="biblioteca/">Ir a la biblioteca</a></p>
            </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
